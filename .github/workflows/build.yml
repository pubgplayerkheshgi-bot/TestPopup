name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          mkdir project
          ZIP=$(find . -type f -name "*.zip" | head -1)
          echo "Found: $ZIP"
          unzip -o "$ZIP" -d project

      - name: Find Gradle
        run: |
          echo "Searching for Gradle..."
          find project -name "gradlew" -type f
          find project -name "settings.gradle*" -type f

      - name: Build APK
        run: |
          GRADLEW=$(find project -name "gradlew" -type f | head -1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: This ZIP does not contain a Gradle Android project."
            echo "Files inside ZIP:"
            find project -maxdepth 4 -type f
            exit 1
          fi

          DIR=$(dirname "$GRADLEW")
          chmod +x "$GRADLEW"
          cd "$DIR"
          "$GRADLEW" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: test-popup-apk
          path: "**/build/outputs/apk/debug/*.apk"
