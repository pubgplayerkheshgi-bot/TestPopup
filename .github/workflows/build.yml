name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Find Android project
        run: |
          find . -name "build.gradle" -o -name "build.gradle.kts" -o -name "gradlew"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build
        run: |
          GRADLEW=$(find . -name "gradlew" | head -1)
          if [ -z "$GRADLEW" ]; then
            echo "No gradlew found."
            exit 1
          fi
          DIR=$(dirname "$GRADLEW")
          chmod +x "$GRADLEW"
          cd "$DIR"
          ./gradlew assembleDebug

      - name: Get APK
        uses: actions/upload-artifact@v4
        with:
          name: test-popup-apk
          path: "**/build/outputs/apk/debug/*.apk"
